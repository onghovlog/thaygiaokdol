<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chi tiết bài viết – Thầy Giáo KDOL</title>

  <link rel="canonical" href="https://thaygiaokdol.vn/bai-viet.html">

  <!-- Tối ưu DNS & Font Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Open Graph / Facebook & Zalo -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Thầy Giáo KDOL">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="Chi tiết bài viết – Thầy Giáo KDOL">
  <meta property="og:description" content="Hệ thống bài viết kiến thức kinh doanh online thực chiến từ Thầy Giáo KDOL.">
  <meta property="og:image" content="https://thaygiaokdol.vn/assets/images/article-default.svg">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chi tiết bài viết – Thầy Giáo KDOL">
  <meta name="twitter:description" content="Hệ thống bài viết kiến thức kinh doanh online thực chiến từ Thầy Giáo KDOL.">

  <link rel="stylesheet" href="css/style.css?v=2.0.0">
</head>
<body>
  <!-- Hỗ trợ trợ năng: Nhảy nhanh tới nội dung chính -->
  <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

  <div class="app-wrapper">
    <div class="app-container">
      
      <!-- SHARED STICKY HEADER (Tự động render bởi JS Component) -->
      <header id="site-header" class="site-header"></header>

      <!-- MAIN CONTENT -->
      <main id="main-content" class="main-content">
        
        <!-- BREADCRUMBS NAVIGATION (Render tự động bởi JS) -->
        <nav id="article-breadcrumbs" class="breadcrumbs" aria-label="Điều hướng"></nav>

        <!-- KHUNG HIỂN THỊ NỘI DUNG BÀI VIẾT HOẶC TRẠNG THÁI 404 (Render tự động bởi JS) -->
        <div id="article-view">
          <!-- Fallback khi trình duyệt chưa tải xong JavaScript -->
          <div style="padding: var(--spacing-xl) var(--page-padding-x); text-align: center; color: var(--color-text-muted);">
            <p>Đang tải nội dung bài viết...</p>
          </div>
        </div>

      </main>

      <!-- SHARED FOOTER (Tự động render bởi JS Component) -->
      <footer id="site-footer" class="site-footer"></footer>

      <!-- SHARED BOTTOM CONTACT BAR (Tự động render bởi JS Component) -->
      <nav id="bottom-contact-bar" class="bottom-contact-bar" aria-label="Thanh liên hệ nhanh"></nav>

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
