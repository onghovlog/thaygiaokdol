<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Vòng tròn nền cam nhạt -->
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>
  
  <!-- Viền ngoài thương hiệu -->
  <circle cx="60" cy="60" r="59" fill="#FFF2EB" stroke="#F37021" stroke-width="2" />
  
  <g clip-path="url(#circleClip)">
    <!-- Nền sau chân dung -->
    <rect width="120" height="120" fill="#FFF7ED" />
    
    <!-- Áo sơ mi & cà vạt -->
    <path d="M20 120 C20 90, 40 82, 60 82 C80 82, 100 90, 100 120 Z" fill="#123FCB" />
    <!-- Cổ áo sơ mi trắng -->
    <polygon points="60 88, 48 82, 52 98, 60 102" fill="#FFFFFF" />
    <polygon points="60 88, 72 82, 68 98, 60 102" fill="#FFFFFF" />
    <!-- Cà vạt cam -->
    <polygon points="60 92, 64 96, 60 118, 56 96" fill="#F37021" />

    <!-- Khuôn mặt Thầy Giáo KDOL -->
    <circle cx="60" cy="54" r="24" fill="#FED7AA" />
    
    <!-- Mái tóc chỉn chu -->
    <path d="M36 50 C36 32, 50 24, 60 24 C72 24, 84 32, 84 50 C80 44, 72 38, 60 38 C48 38, 40 44, 36 50 Z" fill="#20242B" />

    <!-- Cặp kính cận trí tuệ -->
    <circle cx="50" cy="52" r="7" fill="none" stroke="#20242B" stroke-width="2" />
    <circle cx="70" cy="52" r="7" fill="none" stroke="#20242B" stroke-width="2" />
    <line x1="57" y1="52" x2="63" y2="52" stroke="#20242B" stroke-width="2" />

    <!-- Đôi mắt thân thiện -->
    <circle cx="50" cy="52" r="2.5" fill="#20242B" />
    <circle cx="70" cy="52" r="2.5" fill="#20242B" />

    <!-- Nụ cười thương hiệu: 1 đơn hàng - 1 nụ cười -->
    <path d="M52 64 Q60 72 68 64" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

