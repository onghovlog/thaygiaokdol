<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGradAds)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#93C5FD" stroke-width="2" rx="10" />

  <!-- Badge -->
  <rect x="36" y="32" width="160" height="32" rx="16" fill="#123FCB" />
  <text x="116" y="53" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MARKETING ONLINE</text>
  <text x="764" y="54" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#F37021" text-anchor="end">Kiểm soát ROAS thực chiến</text>

  <text x="400" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="24" font-weight="700" fill="#20242B" text-anchor="middle">CHIẾN THUẬT TỐI ƯU CHI PHÍ QUẢNG CÁO</text>
  <text x="400" y="142" font-family="'Be Vietnam Pro', sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Chuyển dịch ngân sách từ "Đốt tiền tìm khách mới" sang "Tối ưu chuyển đổi & Giữ chân"</text>

  <!-- So sánh 2 cột -->
  <g transform="translate(60, 175)">
    <!-- Cột Cách làm cũ -->
    <rect width="320" height="200" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2" />
    <rect x="0" y="0" width="320" height="38" rx="8" fill="#FEE2E2" />
    <text x="160" y="25" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">❌ Cách làm đốt tiền (Rủi ro cao)</text>
    <text x="25" y="70" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#475569">• Tăng ngân sách khi chưa đo lường ROAS</text>
    <text x="25" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#475569">• Không chăm sóc khách cũ sau nhận hàng</text>
    <text x="25" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#475569">• Tỷ lệ hủy/bom đơn vượt ngưỡng 15%</text>
    <text x="25" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#DC2626">→ Kết quả: Doanh thu ảo, lợi nhuận âm</text>
  </g>

  <g transform="translate(420, 175)">
    <!-- Cột Phương pháp Thầy Giáo KDOL -->
    <rect width="320" height="200" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2" />
    <rect x="0" y="0" width="320" height="38" rx="8" fill="#DCFCE7" />
    <text x="160" y="25" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="700" fill="#16A34A" text-anchor="middle">✓ Phương pháp KDOL bền vững</text>
    <text x="25" y="70" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#475569">• Cắt tỉa nhóm quảng cáo có ROAS dưới 2.5</text>
    <text x="25" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#475569">• Xây phễu chăm sóc tự động sau 24h nhận</text>
    <text x="25" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#475569">• Kiểm soát tỷ lệ hoàn hàng dưới mức 5%</text>
    <text x="25" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#16A34A">→ Kết quả: Dòng tiền dương, khách quay lại</text>
  </g>

  <rect x="60" y="395" width="680" height="28" rx="6" fill="#FFFFFF" />
  <text x="400" y="414" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Quy tắc vàng: 80% lợi nhuận ròng đến từ 20% khách hàng trung thành mua lặp lại</text>
</svg>

