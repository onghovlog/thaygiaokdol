<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPartner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="50%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="primaryBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F37021" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadowDrop" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background 2:1 -->
  <rect width="860" height="430" fill="url(#bgPartner)" />
  
  <!-- Decorative Circles in Background -->
  <circle cx="820" cy="40" r="140" fill="#F37021" fill-opacity="0.06" />
  <circle cx="780" cy="380" r="180" fill="#123FCB" fill-opacity="0.05" />
  <circle cx="40" cy="400" r="90" fill="#F37021" fill-opacity="0.05" />

  <!-- Grid accent dots -->
  <g fill="#F37021" opacity="0.15">
    <circle cx="430" cy="50" r="2.5" />
    <circle cx="450" cy="50" r="2.5" />
    <circle cx="470" cy="50" r="2.5" />
    <circle cx="430" cy="70" r="2.5" />
    <circle cx="450" cy="70" r="2.5" />
    <circle cx="470" cy="70" r="2.5" />
  </g>

  <!-- LEFT CONTENT AREA -->
  <g transform="translate(56, 48)">
    <!-- Brand / Topic Badge -->
    <rect width="210" height="34" rx="17" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#F37021" />
    <text x="32" y="22" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F37021" letter-spacing="0.5">CHƯƠNG TRÌNH CỐ VẤN 1:1</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1E293B" line-height="1.2">
      <tspan x="0" dy="0">ĐĂNG KÝ PARTNER</tspan>
      <tspan x="0" dy="44" fill="#F37021">ĐỒNG HÀNH THỰC CHIẾN</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#475569">
      <tspan x="0" dy="0">Cùng Thầy Giáo KDOL xây dựng quy trình bán hàng tinh gọn,</tspan>
      <tspan x="0" dy="24">cắt giảm chi phí Ads vô ích và cam kết ra đơn an tâm.</tspan>
    </text>

    <!-- Features Pill List -->
    <g transform="translate(0, 246)">
      <!-- Pill 1 -->
      <rect width="136" height="28" rx="14" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0" />
      <text x="68" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">✓ Bắt bệnh gian hàng</text>

      <!-- Pill 2 -->
      <rect x="146" width="138" height="28" rx="14" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0" />
      <text x="215" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">✓ Cầm tay chỉ việc</text>

      <!-- Pill 3 -->
      <rect x="294" width="144" height="28" rx="14" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0" />
      <text x="366" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">✓ 1 đơn - 1 nụ cười</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 296)" filter="url(#shadowDrop)">
      <rect width="240" height="48" rx="24" fill="url(#primaryBtnGrad)" />
      <text x="120" y="30" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">ĐĂNG KÝ PARTNER NGAY →</text>
    </g>
  </g>

  <!-- RIGHT ILLUSTRATION AREA -->
  <g transform="translate(560, 48)">
    <!-- Central Card Badge -->
    <rect x="20" y="30" width="220" height="270" rx="20" fill="#FFFFFF" filter="url(#shadowDrop)" stroke="#FED7AA" stroke-width="1.5" />
    
    <!-- Mentor Portrait Icon -->
    <circle cx="130" cy="100" r="50" fill="#FFF2EB" stroke="#F37021" stroke-width="2" />
    <!-- Hair -->
    <ellipse cx="130" cy="74" rx="36" ry="18" fill="#1F2937" />
    <!-- Face -->
    <circle cx="130" cy="98" r="32" fill="#FED7AA" />
    <!-- Glasses -->
    <circle cx="120" cy="95" r="9" fill="none" stroke="#1F2937" stroke-width="2.5" />
    <circle cx="140" cy="95" r="9" fill="none" stroke="#1F2937" stroke-width="2.5" />
    <line x1="129" y1="95" x2="131" y2="95" stroke="#1F2937" stroke-width="2" />
    <!-- Smile -->
    <path d="M123 112 Q130 120 137 112" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <!-- Shirt & Tie -->
    <path d="M102 130 C108 118 152 118 158 130 Z" fill="#123FCB" />
    <polygon points="130,120 134,132 130,138 126,132" fill="#F37021" />

    <!-- Mentor Text Info -->
    <text x="130" y="174" font-family="'Be Vietnam Pro', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Thầy Giáo KDOL</text>
    <text x="130" y="194" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">8+ năm thực chiến đa sàn</text>

    <!-- Stat Tag -->
    <rect x="45" y="218" width="170" height="34" rx="8" fill="#FFF7ED" border="1px solid #FFEDD5" />
    <text x="130" y="239" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">1 Đơn Hàng - 1 Nụ Cười</text>

    <!-- Floating Order Notification Badge -->
    <g transform="translate(-30, 210)" filter="url(#shadowDrop)">
      <rect width="140" height="42" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
      <circle cx="22" cy="21" r="11" fill="#DCFCE7" />
      <path d="M17 21 L20 24 L27 17" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="39" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="700" fill="#166534">Đơn hàng mới</text>
      <text x="39" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="9" fill="#4B5563">+1 nụ cười an tâm</text>
    </g>

    <!-- Floating Growth Badge -->
    <g transform="translate(140, 10)" filter="url(#shadowDrop)">
      <rect width="110" height="38" rx="19" fill="#123FCB" />
      <text x="55" y="24" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">📈 Tăng trưởng 1:1</text>
    </g>
  </g>
</svg>
