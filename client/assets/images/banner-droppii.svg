<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDroppii" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="droppiiBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="shadowDroppii" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350F" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background 2:1 -->
  <rect width="860" height="430" fill="url(#bgDroppii)" />

  <!-- Background accents -->
  <circle cx="830" cy="50" r="140" fill="#EA580C" fill-opacity="0.06" />
  <circle cx="780" cy="390" r="170" fill="#123FCB" fill-opacity="0.05" />
  <circle cx="40" cy="390" r="80" fill="#EA580C" fill-opacity="0.05" />

  <!-- Dots grid -->
  <g fill="#D97706" opacity="0.2">
    <circle cx="420" cy="50" r="2.5" />
    <circle cx="440" cy="50" r="2.5" />
    <circle cx="460" cy="50" r="2.5" />
    <circle cx="420" cy="70" r="2.5" />
    <circle cx="440" cy="70" r="2.5" />
    <circle cx="460" cy="70" r="2.5" />
  </g>

  <!-- LEFT CONTENT -->
  <g transform="translate(56, 48)">
    <!-- Badge -->
    <rect width="200" height="34" rx="17" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#D97706" />
    <text x="32" y="22" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B45309" letter-spacing="0.5">MÔ HÌNH DROPSHIPPING 4.0</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#1C1917">
      <tspan x="0" dy="0">DROPPII LÀ GÌ?</tspan>
      <tspan x="0" dy="44" fill="#EA580C">GIẢI PHÁP 4 KHÔNG ĐỘT PHÁ</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#44403C">
      <tspan x="0" dy="0">Bắt đầu kinh doanh đa kênh không rủi ro tài chính:</tspan>
      <tspan x="0" dy="24">Kho hàng chuẩn, đóng gói tự động, chiết khấu hoa hồng cao.</tspan>
    </text>

    <!-- 4 Không Badges Grid -->
    <g transform="translate(0, 246)">
      <rect width="100" height="28" rx="6" fill="#FFFFFF" stroke="#E7E5E4" />
      <text x="50" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">✕ Vốn nhập</text>

      <rect x="108" width="100" height="28" rx="6" fill="#FFFFFF" stroke="#E7E5E4" />
      <text x="158" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">✕ Tồn kho</text>

      <rect x="216" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#E7E5E4" />
      <text x="270" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">✕ Đóng gói</text>

      <rect x="332" width="112" height="28" rx="6" fill="#FFFFFF" stroke="#E7E5E4" />
      <text x="388" y="18" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">✕ Kinh nghiệm</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 296)" filter="url(#shadowDroppii)">
      <rect width="230" height="48" rx="24" fill="url(#droppiiBtnGrad)" />
      <text x="115" y="30" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">TÌM HIỂU MÔ HÌNH →</text>
    </g>
  </g>

  <!-- RIGHT GRAPHIC AREA -->
  <g transform="translate(540, 48)">
    <!-- Diagram Card Background -->
    <rect x="10" y="24" width="250" height="280" rx="20" fill="#FFFFFF" filter="url(#shadowDroppii)" stroke="#FDE68A" stroke-width="1.5" />

    <!-- Droppii Center Box Illustration -->
    <g transform="translate(75, 46)">
      <!-- Package / Box icon -->
      <polygon points="60,20 110,45 60,70 10,45" fill="#FDBA74" stroke="#EA580C" stroke-width="2" />
      <polygon points="10,45 60,70 60,120 10,95" fill="#FB923C" stroke="#EA580C" stroke-width="2" />
      <polygon points="110,45 60,70 60,120 110,95" fill="#EA580C" stroke="#C2410C" stroke-width="2" />
      <circle cx="60" cy="55" r="8" fill="#FFFFFF" />
      <path d="M56 55 L59 58 L65 52" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Info text inside card -->
    <text x="135" y="190" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="800" fill="#1C1917" text-anchor="middle">DROPPII VIỆT NAM</text>
    <text x="135" y="210" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="500" fill="#78716C" text-anchor="middle">Hơn 3.000+ sản phẩm chính hãng</text>

    <!-- 2 Features row -->
    <g transform="translate(25, 226)">
      <rect width="105" height="36" rx="8" fill="#FFFBEB" stroke="#FEF3C7" />
      <text x="52" y="16" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Kho vận 5.000m²</text>
      <text x="52" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="8" fill="#78716C" text-anchor="middle">HN &amp; TP.HCM</text>

      <rect x="115" width="105" height="36" rx="8" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="167" y="16" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Hoa hồng tới 45%</text>
      <text x="167" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="8" fill="#047857" text-anchor="middle">Nhận đúng hạn</text>
    </g>

    <text x="135" y="288" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="600" fill="#A8A29E" text-anchor="middle">Thầy Giáo KDOL Cố Vấn Thực Chiến</text>

    <!-- Top floating sticker -->
    <g transform="translate(160, 10)" filter="url(#shadowDroppii)">
      <rect width="115" height="34" rx="17" fill="#123FCB" />
      <text x="57" y="22" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">🚀 Dropshipping</text>
    </g>
  </g>
</svg>
