<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  
  <!-- Nền minh họa sạch -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="796" height="446" fill="none" stroke="#FDBA74" stroke-width="2" rx="10" />

  <!-- Huy hiệu thương hiệu -->
  <rect x="36" y="32" width="160" height="32" rx="16" fill="#F37021" />
  <text x="116" y="53" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">THẦY GIÁO KDOL</text>
  
  <text x="764" y="54" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#123FCB" text-anchor="end">1 đơn hàng - 1 nụ cười</text>

  <!-- Tiêu đề sơ đồ -->
  <text x="400" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="24" font-weight="700" fill="#20242B" text-anchor="middle">MÔ HÌNH KINH DOANH ONLINE TINH GỌN (KDOL)</text>
  <text x="400" y="142" font-family="'Be Vietnam Pro', sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Quy trình 3 trụ cột: Nguồn hàng tin cậy - Vận hành tối ưu - Khách hàng hài lòng</text>

  <!-- Khối 1: Nguồn hàng & Đối tác -->
  <g transform="translate(60, 180)">
    <rect width="190" height="190" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="95" cy="55" r="28" fill="#FFF2EB" />
    <!-- Biểu tượng Kho hàng / Hàng hóa -->
    <rect x="79" y="43" width="32" height="24" rx="3" fill="#F37021" />
    <path d="M79 49 L95 57 L111 49" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <text x="95" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="700" fill="#20242B" text-anchor="middle">1. Nguồn hàng chuẩn</text>
    <text x="95" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Pháp lý minh bạch</text>
    <text x="95" y="158" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Không áp lực tồn kho</text>
  </g>

  <!-- Mũi tên 1 -> 2 -->
  <g transform="translate(262, 265)">
    <path d="M 0 0 L 35 0 M 25 -8 L 35 0 L 25 8" stroke="#F37021" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Khối 2: Tư vấn & Xử lý đơn -->
  <g transform="translate(305, 180)">
    <rect width="190" height="190" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="95" cy="55" r="28" fill="#EFF6FF" />
    <!-- Biểu tượng Tư vấn / Điện thoại -->
    <rect x="83" y="41" width="24" height="28" rx="4" fill="#123FCB" />
    <circle cx="95" cy="62" r="2" fill="#FFFFFF" />
    <text x="95" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="700" fill="#20242B" text-anchor="middle">2. Tư vấn giải pháp</text>
    <text x="95" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Đúng nhu cầu thực tế</text>
    <text x="95" y="158" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Tối ưu chi phí Ads</text>
  </g>

  <!-- Mũi tên 2 -> 3 -->
  <g transform="translate(507, 265)">
    <path d="M 0 0 L 35 0 M 25 -8 L 35 0 L 25 8" stroke="#123FCB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Khối 3: Giao hàng & Giữ chân -->
  <g transform="translate(550, 180)">
    <rect width="190" height="190" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="95" cy="55" r="28" fill="#FEF3C7" />
    <!-- Nụ cười hài lòng -->
    <circle cx="95" cy="55" r="16" fill="none" stroke="#D97706" stroke-width="2.5" />
    <circle cx="89" cy="52" r="2" fill="#D97706" />
    <circle cx="101" cy="52" r="2" fill="#D97706" />
    <path d="M89 60 Q95 66 101 60" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
    <text x="95" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="700" fill="#20242B" text-anchor="middle">3. Khách hàng nụ cười</text>
    <text x="95" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Hậu mãi chu đáo</text>
    <text x="95" y="158" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Tỷ lệ mua lại cao</text>
  </g>

  <!-- Dòng chân trang sơ đồ -->
  <rect x="60" y="395" width="680" height="28" rx="6" fill="#F8FAFC" />
  <text x="400" y="414" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Phương châm thực chiến: Lợi nhuận bền vững đến từ giá trị trao cho khách hàng</text>
</svg>

